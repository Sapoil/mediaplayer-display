<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="bg"></div>
    <div id="content">
        <div id="close-btn" onclick="closeApp()">✕</div>
        <div id="fs-btn" onclick="toggleFS()">🗖</div>
        <img id="cover" src="" />
        <div id="title">—</div>
        <div id="artist">—</div>
        <div id="source"></div>
        <div id="progress-container">
            <div id="progress-bar"></div>
        </div>
        <div id="time">0:00 / 0:00</div>
        <div id="controls">
            <button class="ctrl-btn" onclick="prevTrack()">⏮</button>
            <button id="play-pause-btn" class="ctrl-btn" onclick="playPause()">⏸</button>
            <button class="ctrl-btn" onclick="nextTrack()">⏭</button>
        </div>
        <div id="volume-wrapper">
            <button id="mute-btn" class="ctrl-btn" onclick="toggleMute()">🔈</button>
            <div id="volume-container" onmousedown="startVolumeDrag(event)">
                <div id="volume-fill"></div>
            </div>
        </div>
    </div>

    <script>
        let currentDuration = 0;
        let isVolumeDragging = false;
        const volumeContainer = document.getElementById('volume-container');
        const volumeFill = document.getElementById('volume-fill');

        window.addEventListener('pywebviewready', init);

        function init() {
            refresh()
        }
        async function refresh() {
            try {
                const data = await window.pywebview.api.get_now_playing();
                updateNowPlaying(data);
            } catch (e) {
                console.error('refresh error', e);
            }
            setTimeout(refresh, 1000);
        }

        let isDragging = false;

        const container = document.getElementById('progress-container');

        container.addEventListener('mousedown', () => { isDragging = true; });
        window.addEventListener('mouseup', (e) => {
            if (isDragging) {
                isDragging = false;
                seekTo(e);  // envoie le seek seulement au relâchement
            }
        });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const rect = container.getBoundingClientRect();
            const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            document.getElementById('progress-bar').style.width = `${ratio * 100}%`;  // preview seulement
        });

        function fmt(sec) {
            sec = Math.max(0, Math.floor(sec));
            const m = Math.floor(sec / 60);
            const s = String(sec % 60).padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateNowPlaying(data) {
            if (!data) return;
            document.getElementById('title').textContent = data.title || '—';
            document.getElementById('artist').textContent = data.artist || '—';
            document.getElementById('source').textContent = data.source_app || '';

            if (data.thumbnail_b64) {
                const src = `data:image/jpeg;base64,${data.thumbnail_b64}`;
                document.getElementById('cover').src = src;
                document.getElementById('bg').style.backgroundImage = `url(${src})`;
            }
            currentDuration = data.duration || 0;
            if (!isVolumeDragging && typeof data.volume === 'number') {
                applyVolumeVisual(data.volume);
            }
            const muteBtn = document.getElementById('mute-btn');
            muteBtn.textContent = data.muted ? '🔇' : '🔈';

            if (!isDragging) {
                const pct = data.duration ? (data.position / data.duration) * 100 : 0;
                document.getElementById('progress-bar').style.width = `${pct}%`;
                document.getElementById('time').textContent =
                    `${fmt(data.position)} / ${fmt(data.duration)}`;
            }
            const btn = document.getElementById('play-pause-btn');
            btn.textContent = data.status === 4 ? '⏸' : '▶';
        }

        function seekTo(e) {
            const container = document.getElementById('progress-container');
            const rect = container.getBoundingClientRect();
            const ratio = (e.clientX - rect.left) / rect.width;
            const targetSeconds = Math.max(0, Math.min(1, ratio)) * currentDuration;

            // feedback visuel immédiat, avant confirmation
            document.getElementById('progress-bar').style.width = `${ratio * 100}%`;

            window.pywebview.api.seek(targetSeconds).then(data => {
                if (data) updateNowPlaying(data);
            });
        }
        async function playPause() {
            const btn = document.getElementById('play-pause-btn');
            const wasPlaying = btn.textContent === '⏸';
            btn.textContent = wasPlaying ? '▶' : '⏸';

            const data = await window.pywebview.api.play_pause();
            if (data) updateNowPlaying(data);
        }
        function nextTrack() {
            window.pywebview.api.next_track();
        }
        function prevTrack() {
            window.pywebview.api.previous_track();
        }

        function closeApp() {
            window.pywebview.api.close_app();
        }

        function toggleFS() {
            window.pywebview.api.toggle_fullscreen();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeApp();
            }
        });

        function applyVolumeVisual(ratio) {
            volumeFill.style.height = `${ratio * 100}%`;
        }

        function toggleMute() {
            window.pywebview.api.toggle_mute().then(data => {
                if (data) updateNowPlaying(data);
            });
            const muteBtn = document.getElementById('mute-btn');
            muteBtn.textContent = data.muted ? '🔇' : '🔈';
        }

        function volumeRatioFromEvent(e) {
            const rect = volumeContainer.getBoundingClientRect();
            const ratio = (rect.bottom - e.clientY) / rect.height; // inversé : haut = plus fort
            return Math.max(0, Math.min(1, ratio));
        }

        function startVolumeDrag(e) {
            isVolumeDragging = true;
            const ratio = volumeRatioFromEvent(e);
            applyVolumeVisual(ratio);
        }

        window.addEventListener('mousemove', (e) => {
            if (!isVolumeDragging) return;
            applyVolumeVisual(volumeRatioFromEvent(e));
        });

        window.addEventListener('mouseup', async (e) => {
            if (!isVolumeDragging) return;
            isVolumeDragging = false;
            const ratio = volumeRatioFromEvent(e);
            const data = await window.pywebview.api.set_volume(ratio);
            if (data) updateNowPlaying(data);
        });

    </script>
</body>

</html>
